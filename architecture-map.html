<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck Salone — Architecture Map</title>
<style>
:root {
  --bg: #000000;
  --panel: #0a0a0c;
  --panel-2: #141417;
  --border: #222226;
  --text: #f4f5f8;
  --muted: #8e95a5;
  --client: #38bdf8;
  --route: #4ade80;
  --service: #c084fc;
  --db: #ceb100;
  --external: #f472b6;
  --critical: #ef4444;
  --accent: #f4e059;
  --accent-2: #ceb100;
  --brand-yellow: #f4e059;
  --brand-black: #000000;
  --brand-dark-yellow: #ceb100;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}
#topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
  z-index: 10;
}
#topbar .title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-right: 12px;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.chip {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  transition: all .15s ease;
  user-select: none;
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.active {
  background: var(--accent);
  color: #000000;
  border-color: var(--accent);
  font-weight: 700;
}
#zoom-controls {
  margin-left: auto;
  display: flex;
  gap: 6px;
}
.zbtn {
  width: 30px;
  height: 30px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.zbtn:hover { background: var(--border); border-color: var(--accent); color: var(--accent); }

#canvas-wrap {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}
#svg-area {
  flex: 1;
  overflow: hidden;
  cursor: grab;
  position: relative;
  background: radial-gradient(circle at 50% 50%, #101114 0%, #000000 100%);
}
#svg-area:active { cursor: grabbing; }
svg#graph {
  width: 100%;
  height: 100%;
  display: block;
}

#sidebar {
  width: 360px;
  min-width: 360px;
  background: var(--panel);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px 18px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: -4px 0 24px rgba(0,0,0,0.7);
  z-index: 5;
}
.sb-section { display: flex; flex-direction: column; gap: 6px; }
.sb-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 2px; font-weight: 700; }
.sb-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.sb-sub { font-size: 12px; color: var(--accent); font-weight: 600; }
.sb-role { font-size: 12px; color: #d0d0d0; border-left: 3px solid var(--accent); padding-left: 10px; line-height: 1.5; }
.sb-plain { font-size: 12px; color: var(--text); line-height: 1.55; background: var(--panel-2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
.sb-path { font-size: 11px; color: var(--client); background: rgba(56,189,248,.08); padding: 5px 8px; border-radius: 4px; word-break: break-all; font-family: monospace; }
.sb-notes { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sb-notes li { font-size: 11.5px; color: #bbb; padding-left: 16px; position: relative; line-height: 1.45; }
.sb-notes li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: bold; }
.sb-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
.edge-pill { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10.5px; margin: 2px 2px 2px 0; font-weight: 500; font-family: monospace; }
.ep-critical { background: rgba(239,68,68,.15); color: var(--critical); border: 1px solid rgba(239,68,68,0.3); }
.ep-api { background: rgba(206,177,0,.15); color: var(--accent); border: 1px solid rgba(206,177,0,0.35); }
.ep-db { background: rgba(206,177,0,.15); color: var(--accent); border: 1px solid rgba(206,177,0,0.35); }
.ep-mount { background: rgba(56,189,248,.15); color: var(--client); border: 1px solid rgba(56,189,248,0.3); }
.ep-normal { background: rgba(139,146,160,.15); color: var(--muted); border: 1px solid rgba(139,146,160,0.3); }
.findings { background: rgba(244,224,89,.05); border: 1px solid rgba(244,224,89,.3); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.findings-title { color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.finding-item { font-size: 11.5px; color: var(--text); line-height: 1.5; padding-left: 16px; position: relative; }
.finding-item::before { content: "⚠️"; position: absolute; left: 0; font-size: 10px; top: 1px; }
.badge-bug { display: inline-block; background: var(--critical); color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; text-align: center; line-height: 16px; font-weight: 700; }
.badge-resolved { display: inline-block; background: #10b981; color: #fff; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; text-align: center; line-height: 16px; font-weight: 700; }
.crit-badge { display: inline-block; background: rgba(239,68,68,.2); color: var(--critical); border: 1px solid rgba(239,68,68,.5); border-radius: 4px; font-size: 9px; padding: 2px 6px; font-weight: 700; letter-spacing: 0.04em; }
.resolved-badge { display: inline-block; background: rgba(16,185,129,.2); color: #10b981; border: 1px solid rgba(16,185,129,.5); border-radius: 4px; font-size: 9px; padding: 2px 6px; font-weight: 700; letter-spacing: 0.04em; }
.dead-badge { display: inline-block; background: rgba(255,255,255,0.08); color: #888; border: 1px solid #444; border-radius: 4px; font-size: 9px; padding: 2px 6px; font-weight: 700; }
.legend { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.node-group { cursor: pointer; }
.node-body { transition: all .15s ease; }
.node-group:hover .node-body { filter: brightness(1.25); stroke-width: 2px; }
.node-group.selected .node-body { filter: brightness(1.35) drop-shadow(0 0 12px rgba(244,224,89,.65)); stroke-width: 2.5px !important; stroke: var(--accent) !important; }
.node-group.dimmed .node-body { opacity: .18; }
.node-group.dimmed text { opacity: .18; }
.node-group.dimmed circle { opacity: .18; }
.edge-path { transition: opacity .15s ease; }
.edge-path.dimmed { opacity: .04; }
@media(max-width:960px){ #sidebar { display: none; } }

</style>
</head>

  t.setAttribute("font-size","10");t.setAttribute("font-family","monospace");t.setAttribute("font-weight","700");
  t.setAttribute("letter-spacing","0.06em");t.setAttribute("fill",c.color+"dd");t.textContent=c.label.toUpperCase();
  root.appendChild(t);
});

const hexC={client:"#38bdf8",route:"#4ade80",service:"#c084fc",db:"#ceb100",external:"#f472b6"};
const edgeCM={critical:"#ef4444",api:"#ceb100",db:"#ceb100",mount:"#38bdf8",normal:"#64748b"};

const edgeEls=[];
edges.forEach(e=>{
  const fn=nodes.find(n=>n.id===e.from),tn=nodes.find(n=>n.id===e.to);
  if(!fn||!tn)return;
  const x1=fn.x+fn.w,y1=fn.y+fn.h/2,x2=tn.x,y2=tn.y+tn.h/2;
  const same=fn.cluster===tn.cluster;
  const cx1=same?x1+40:(x1+x2)/2,cy1=y1,cx2=same?x2-10:(x1+x2)/2,cy2=y2;
  const color=edgeCM[e.kind]||"#64748b";
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","edge-path");
  g.dataset.from=e.from;g.dataset.to=e.to;g.dataset.tag=JSON.stringify(e.tag);
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
  path.setAttribute("fill","none");path.setAttribute("stroke",color);
  path.setAttribute("stroke-width",e.kind==="critical"?"2":"1.2");
  path.setAttribute("opacity",e.kind==="normal"?"0.35":"0.7");
  path.setAttribute("marker-end",`url(#arr-${e.kind})`);
  g.appendChild(path);
  if(e.kind==="critical"||e.kind==="mount"){
    const mx=(x1+cx1+cx2+x2)/4,my=(y1+cy1+cy2+y2)/4;
    const lt=document.createElementNS("http://www.w3.org/2000/svg","text");
    lt.setAttribute("x",mx);lt.setAttribute("y",my-4);lt.setAttribute("text-anchor","middle");
    lt.setAttribute("font-size","7.5");lt.setAttribute("fill",color);lt.setAttribute("opacity","0.85");
    lt.setAttribute("font-family","monospace");lt.textContent=e.label;g.appendChild(lt);
  }
  root.appendChild(g);edgeEls.push({el:g,edge:e});
});

const nodeEls={};
nodes.forEach(n=>{
  const c=hexC[n.color]||"#8e95a5",isDead=n.dead===true,isCrit=n.critical===true;
  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","node-group");g.id=`ng-${n.id}`;
  g.dataset.id=n.id;g.dataset.tag=JSON.stringify(n.tag||["all"]);
  const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
  rect.setAttribute("class","node-body");rect.setAttribute("x",n.x);rect.setAttribute("y",n.y);
  rect.setAttribute("width",n.w);rect.setAttribute("height",n.h);rect.setAttribute("rx","6");
  rect.setAttribute("fill",isDead?"#141416":"#161619");
  rect.setAttribute("stroke",isDead?"#2c2c34":c);
  rect.setAttribute("stroke-width",isCrit?"2":isDead?"1":"1.3");
  if(isDead)rect.setAttribute("stroke-dasharray","3,2");
  g.appendChild(rect);
  const bar=document.createElementNS("http://www.w3.org/2000/svg","rect");
  bar.setAttribute("x",n.x);bar.setAttribute("y",n.y+6);bar.setAttribute("width","3");bar.setAttribute("height",n.h-12);
  bar.setAttribute("rx","2");bar.setAttribute("fill",isDead?"#444":c);bar.setAttribute("opacity",isDead?"0.3":isCrit?"1":"0.75");
  g.appendChild(bar);
  const lbl=document.createElementNS("http://www.w3.org/2000/svg","text");
  lbl.setAttribute("x",n.x+10);lbl.setAttribute("y",n.y+17);lbl.setAttribute("font-size","10.5");
  lbl.setAttribute("font-weight","700");lbl.setAttribute("fill",isDead?"#666":"#ffffff");
  lbl.setAttribute("font-family","monospace");lbl.textContent=n.label;g.appendChild(lbl);
  const sub=document.createElementNS("http://www.w3.org/2000/svg","text");
  sub.setAttribute("x",n.x+10);sub.setAttribute("y",n.y+31);sub.setAttribute("font-size","8.5");
  sub.setAttribute("fill",isDead?"#555":c);sub.setAttribute("font-family","sans-serif");sub.setAttribute("opacity","0.85");
  sub.textContent=n.sub;g.appendChild(sub);
  if(isDead){const db=document.createElementNS("http://www.w3.org/2000/svg","text");db.setAttribute("x",n.x+n.w-6);db.setAttribute("y",n.y+12);db.setAttribute("text-anchor","end");db.setAttribute("font-size","7");db.setAttribute("fill","#777");db.setAttribute("font-family","monospace");db.setAttribute("font-weight","bold");db.textContent="DEAD";g.appendChild(db);}
  const bugs=KNOWN_BUGS[n.id];
  if(bugs&&bugs.length){
    const allResolved=bugs.every(b=>b.status==="RESOLVED");
    const bc=document.createElementNS("http://www.w3.org/2000/svg","circle");
    bc.setAttribute("cx",n.x+n.w-8);bc.setAttribute("cy",n.y+8);bc.setAttribute("r","7");
    bc.setAttribute("fill",allResolved?"#10b981":"#ef4444");
    const bt=document.createElementNS("http://www.w3.org/2000/svg","text");
    bt.setAttribute("x",n.x+n.w-8);bt.setAttribute("y",n.y+11);bt.setAttribute("text-anchor","middle");
    bt.setAttribute("font-size","8");bt.setAttribute("fill","#fff");bt.setAttribute("font-weight","700");bt.setAttribute("font-family","sans-serif");
    bt.textContent=allResolved?"✓":bugs.length;
    g.appendChild(bc);g.appendChild(bt);
  }
  if(isCrit){const glow=document.createElementNS("http://www.w3.org/2000/svg","rect");glow.setAttribute("x",n.x-2);glow.setAttribute("y",n.y-2);glow.setAttribute("width",n.w+4);glow.setAttribute("height",n.h+4);glow.setAttribute("rx","8");glow.setAttribute("fill","none");glow.setAttribute("stroke","#ef4444");glow.setAttribute("stroke-width","0.6");glow.setAttribute("opacity","0.35");g.appendChild(glow);}
  g.addEventListener("click",ev=>{ev.stopPropagation();selectNode(n.id);});
  g.addEventListener("mouseenter",()=>{if(!selectedNode)hlNode(n.id);});
  g.addEventListener("mouseleave",()=>{if(!selectedNode)clearHL();});
  root.appendChild(g);nodeEls[n.id]=g;
});

function selectNode(id){selectedNode=id;hlNode(id);showSidebar(id);}
function hlNode(id){
  const conn=new Set([id]),connE=new Set();
  edgeEls.forEach(({el,edge})=>{if(edge.from===id||edge.to===id){conn.add(edge.from);conn.add(edge.to);connE.add(el);}});
  Object.entries(nodeEls).forEach(([nid,g])=>{if(conn.has(nid)){g.classList.remove("dimmed");g.classList.toggle("selected",nid===id);}else{g.classList.add("dimmed");g.classList.remove("selected");}});
  edgeEls.forEach(({el})=>el.classList.toggle("dimmed",!connE.has(el)));
}
function clearHL(){
  selectedNode=null;
  Object.values(nodeEls).forEach(g=>g.classList.remove("dimmed","selected"));
  edgeEls.forEach(({el})=>el.classList.remove("dimmed"));
  showDefaultSidebar();
}
document.getElementById("svg-area").addEventListener("click",()=>clearHL());

const filterDefs=[
  {id:"all",label:"Show All Components"},
  {id:"overview",label:"Core Overview"},
  {id:"auth",label:"Auth & Login"},
  {id:"mixes",label:"Mixes & Audio"},
  {id:"bookings",label:"Bookings"},
  {id:"events",label:"Events & Tickets"},
  {id:"battles",label:"Battles"},
  {id:"subscriptions",label:"Subscriptions"},
  {id:"admin",label:"Admin"},
  {id:"bugs",label:"🛡️ Resolved Bugs & Hardening"}
];
const chipC=document.getElementById("chips");
filterDefs.forEach(f=>{
  const b=document.createElement("button");b.className="chip"+(f.id==="all"?" active":"");
  b.textContent=f.label;b.dataset.filter=f.id;b.addEventListener("click",()=>applyFilter(f.id));chipC.appendChild(b);
});
function applyFilter(fid){
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.filter===fid));
  clearHL();
  if(fid==="bugs"){
    const bn=new Set([...Object.keys(KNOWN_BUGS),...nodes.filter(n=>n.dead).map(n=>n.id)]);
    Object.entries(nodeEls).forEach(([id,g])=>g.style.opacity=bn.has(id)?"1":"0.08");
    edgeEls.forEach(({el,edge})=>el.style.opacity=(bn.has(edge.from)||bn.has(edge.to))?"0.7":"0.03");
    return;
  }
  if(fid==="all"){
    Object.values(nodeEls).forEach(g=>g.style.opacity="1");
    edgeEls.forEach(({el})=>el.style.opacity="1");
    return;
  }
  edgeEls.forEach(({el,edge})=>el.style.opacity=(edge.tag||["all"]).includes(fid)?"1":"0.05");
  Object.entries(nodeEls).forEach(([id,g])=>{const n=nodes.find(n=>n.id===id);g.style.opacity=(n?.tag||["all"]).includes(fid)?"1":"0.18";});
}

function showSidebar(nodeId){
  const n=nodes.find(n=>n.id===nodeId);if(!n)return;
  const inE=edges.filter(e=>e.to===nodeId),outE=edges.filter(e=>e.from===nodeId);
  const bugs=KNOWN_BUGS[nodeId]||[];
  let h=`<div class="sb-section"><div class="sb-label">Selected Node</div>
    <div class="sb-title">${n.label}${n.critical?'<span class="crit-badge">CRITICAL PATH</span>':''}${n.dead?'<span class="dead-badge">DEAD CODE</span>':''}</div>
    <div class="sb-sub">${n.sub}</div></div>
    <div class="sb-section"><div class="sb-label">Technical Role</div><div class="sb-role">${n.role||"&mdash;"}</div></div>
    <div class="sb-section"><div class="sb-label">Plain English</div><div class="sb-plain">${n.plain||"&mdash;"}</div></div>
    <div class="sb-section"><div class="sb-label">File Path</div><div class="sb-path">${n.path||"&mdash;"}</div></div>`;
  if(n.notes&&n.notes.length)h+=`<div class="sb-section"><div class="sb-label">Code Details</div><ul class="sb-notes">${n.notes.map(nt=>`<li>${nt}</li>`).join("")}</ul></div>`;
  h+=`<hr class="sb-divider">`;
  if(inE.length){h+=`<div class="sb-section"><div class="sb-label">Incoming Connections (${inE.length})</div>`;inE.slice(0,8).forEach(e=>{const f=nodes.find(n=>n.id===e.from);h+=`<div class="edge-pill ep-${e.kind}">${f?.label||e.from} &rarr; ${e.label}</div>`;});h+=`</div>`;}
  if(outE.length){h+=`<div class="sb-section"><div class="sb-label">Outgoing Calls (${outE.length})</div>`;outE.slice(0,8).forEach(e=>{const t=nodes.find(n=>n.id===e.to);h+=`<div class="edge-pill ep-${e.kind}">${e.label} &rarr; ${t?.label||e.to}</div>`;});h+=`</div>`;}
  if(bugs.length){
    const allResolved=bugs.every(b=>b.status==="RESOLVED");
    h+=`<hr class="sb-divider"><div class="sb-section"><div class="sb-label" style="color:${allResolved?'#10b981':'var(--critical)'}">${allResolved?'Resolved Issues & Hardening':'Identified Issues / Bugs'} (${bugs.length})</div>`;
    bugs.forEach(b=>{
      const isRes=b.status==="RESOLVED";
      h+=`<div style="margin-bottom:8px;font-size:11.5px;background:${isRes?'rgba(16,185,129,0.08)':'rgba(239,68,68,0.08)'};padding:8px 10px;border-radius:6px;border:1px solid ${isRes?'rgba(16,185,129,0.3)':'rgba(239,68,68,0.25)'}">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="${isRes?'badge-resolved':'badge-bug'}">${isRes?'✓':b.sev[0].toUpperCase()}</span>
          <span style="color:${isRes?'#10b981':'#ef4444'};font-family:monospace;font-size:10.5px;font-weight:bold">${b.ref}</span>
          <span class="${isRes?'resolved-badge':'crit-badge'}">${b.status||'ISSUE'}</span>
        </div>
        <div style="color:#eee;margin-top:4px;line-height:1.4">${b.t}</div>
      </div>`;
    });
    h+=`</div>`;
  }
  document.getElementById("sb-content").innerHTML=h;
}

function showDefaultSidebar(){
  document.getElementById("sb-content").innerHTML=`
    <div class="sb-section"><div class="sb-label">Architecture Map Overview</div>
      <div class="sb-title">Deck Salone System Map</div>
      <div class="sb-sub">Sierra Leone's Premier DJ & Streaming Platform</div></div>
    <div class="sb-section"><div class="sb-plain">

      <strong>Stack:</strong> React 19 + Vite 7 SPA &bull; Express 5 API &bull; PostgreSQL (Prisma ORM) &bull; Redis Cache &bull; S3/R2 Cloud Storage &bull; Capacitor Android Shell<br><br>
      <strong>Metrics:</strong> <code>${nodes.length}</code> nodes &bull; <code>${edges.length}</code> connections &bull; <code>${nodes.filter(n=>n.critical).length}</code> critical spine nodes &bull; <code>${Object.keys(KNOWN_BUGS).length}</code> resolved bug fixes
    </div></div>

      <div class="finding-item" style="color:#eee"><strong style="color:#10b981">✓ Shared Username Utilities:</strong> Extracted <code>RESERVED_USERNAMES</code>, <code>isValidUsername</code>, and generator to <code>utils/username.ts</code>.</div>

        <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div>Route Mount / Component Wire</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ceb100"></div>External API / Provider (#ceb100)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ceb100"></div>Prisma Database Read/Write (#ceb100)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div>Standard Internal Call</div>
      </div></div>`;
}

const svgArea=document.getElementById("svg-area");
svgArea.addEventListener("mousedown",e=>{
  if(e.target===svgArea||e.target===svg||e.target===root||e.target.tagName==="svg"){isPanning=true;panSX=e.clientX;panSY=e.clientY;panVX=vpX;panVY=vpY;}
});
window.addEventListener("mousemove",e=>{if(!isPanning)return;vpX=panVX+(e.clientX-panSX);vpY=panVY+(e.clientY-panSY);applyT();});
window.addEventListener("mouseup",()=>isPanning=false);
svgArea.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=svgArea.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
  const f=e.deltaY<0?1.12:0.89,ns=Math.max(0.25,Math.min(3,vpS*f));
  vpX=cx-(cx-vpX)*(ns/vpS);vpY=cy-(cy-vpY)*(ns/vpS);vpS=ns;applyT();
},{passive:false});

function fitView(){
  const r=svgArea.getBoundingClientRect();
  const w=r.width>50?r.width:(window.innerWidth-380);
  const h=r.height>50?r.height:(window.innerHeight-60);
  const sx=(w-40)/CANVAS_W,sy=(h-40)/CANVAS_H;
  vpS=Math.max(0.25, Math.min(sx,sy,1.0));
  vpX=Math.max(10,(w-CANVAS_W*vpS)/2);
  vpY=20;
  applyT();
}
document.getElementById("btn-fit").addEventListener("click",fitView);
document.getElementById("btn-plus").addEventListener("click",()=>{vpS=Math.min(3,vpS*1.2);applyT();});
document.getElementById("btn-minus").addEventListener("click",()=>{vpS=Math.max(0.25,vpS/1.2);applyT();});

svg.setAttribute("viewBox",`0 0 ${CANVAS_W} ${CANVAS_H}`);
window.addEventListener("resize",fitView);
window.addEventListener("load",fitView);

// Initial call
fitView();
showDefaultSidebar();
applyFilter("all");
</script>
