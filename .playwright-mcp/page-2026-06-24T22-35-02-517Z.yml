      - generic [ref=e193]:
        - generic [ref=e194]:
          - generic [ref=e195]: THE JOURNEY
          - heading "A History of DJ Culture in Sierra Leone" [level=2] [ref=e197]
        - generic [ref=e200]:
          - generic [ref=e203]:
            - text: "1985"
            - heading "First Sound System in Freetown" [level=4] [ref=e204]
            - paragraph [ref=e205]: Mobile sound systems appear in Freetown. DJs begin playing at weddings and community events using vinyl records and basic mixers.
          - generic [ref=e208]:
            - text: "1990"
            - heading "Rise of Mobile DJ Culture" [level=4] [ref=e209]
            - paragraph [ref=e210]: DJs take their setups on the road, playing at events across the city. Mobile DJ culture becomes the heartbeat of celebrations.
          - generic [ref=e213]:
            - text: "1995"
            - heading "First DJ Battle at Lumley Beach" [level=4] [ref=e214]
            - paragraph [ref=e215]: The first DJ battle takes place at Lumley Beach, Freetown. Two DJs go head-to-head, launching the competitive DJ scene.
          - generic [ref=e218]:
            - text: "2000"
            - heading "Digital Mixing Arrives" [level=4] [ref=e219]
            - paragraph [ref=e220]: CDJs replace turntables. Digital recording allows DJs to produce higher-quality mixes and reach wider audiences.
          - generic [ref=e223]:
            - text: "2005"
            - heading "Mixtape Culture Explosion" [level=4] [ref=e224]
            - paragraph [ref=e225]: The first widely-circulated mixtapes spread across Sierra Leone. DJs become household names through cassette culture.
          - generic [ref=e228]:
            - text: "2010"
            - heading "Social Media Changes DJ Promotion" [level=4] [ref=e229]
            - paragraph [ref=e230]: Platforms like Facebook transform how DJs promote events and share mixes. The digital revolution reshapes the industry.
          - generic [ref=e233]:
            - text: "2015"
            - heading "Afrobeats Fusion Era Begins" [level=4] [ref=e234]
            - paragraph [ref=e235]: Afrobeats takes center stage. Sierra Leonean DJs blend global sounds with local Salone music, creating a unique fusion.
          - generic [ref=e238]:
            - text: "2018"
            - heading "First National DJ Competition" [level=4] [ref=e239]
            - paragraph [ref=e240]: The first national DJ competition brings together talent from across the country, crowning Sierra Leone's best DJ.
          - generic [ref=e243]:
            - text: "2020"
            - heading "Streaming Platforms Transform Reach" [level=4] [ref=e244]
            - paragraph [ref=e245]: COVID-19 forces innovation. DJs master livestreaming, reaching diaspora communities worldwide through digital platforms.
          - generic [ref=e248]:
            - text: "2025"
            - heading "Deck Salone Platform Launches" [level=4] [ref=e249]
            - paragraph [ref=e250]: The first official digital ecosystem for Sierra Leonean DJs is born, backed by Sound It Entertainment.
