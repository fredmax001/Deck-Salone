      - generic [ref=e44]:
        - generic [ref=e45]:
          - generic [ref=e46]: THE MISSION
          - heading "Why This Matters" [level=2] [ref=e48]
          - generic [ref=e49]:
            - paragraph [ref=e51]: Long before streaming platforms and digital mixers, Sierra Leone's DJs were the heartbeat of our celebrations. From small neighborhood sound systems in Freetown to the biggest stages across the nation, these pioneers shaped the sound of a generation.
            - paragraph [ref=e53]: The Hall of Fame exists to document this rich history — to honor the legends who started it all, preserve the mixes that defined eras, and create a historical record that future generations can learn from and be inspired by.
            - paragraph [ref=e55]: This is a living archive. We rely on the community to share stories, submit mixes, and nominate pioneers who deserve recognition.
          - link "Nominate a Pioneer" [ref=e57] [cursor=pointer]:
            - /url: "#nominate"
