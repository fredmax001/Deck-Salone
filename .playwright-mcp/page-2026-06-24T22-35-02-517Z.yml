        - generic [ref=e79]:
          - generic [ref=e81]:
            - img "DJ MASTER K" [ref=e83]
            - generic [ref=e84]:
              - generic [ref=e85]: Pioneer
              - heading "DJ MASTER K" [level=3] [ref=e86]
              - paragraph [ref=e87]: 1985 – 2010
              - paragraph [ref=e88]: One of the first professional DJs in Freetown, Master K built his own sound system from salvaged parts and played at every major event in the city for 25 years.
              - paragraph [ref=e89]: "Known for: Creating the first mobile DJ setup in Sierra Leone"
              - blockquote [ref=e90]: "\"The music chose me. I just had to find a way to let it speak.\""
          - generic [ref=e92]:
            - img "QUEEN LUCY" [ref=e94]
            - generic [ref=e95]:
              - generic [ref=e96]: Pioneer
              - heading "QUEEN LUCY" [level=3] [ref=e97]
              - paragraph [ref=e98]: 1990 – 2015
              - paragraph [ref=e99]: Breaking barriers as one of the first female DJs in Sierra Leone, Queen Lucy inspired a generation of women to take up the craft. Her Sunday gospel mixes are still talked about today.
              - paragraph [ref=e100]: "Known for: Pioneering female DJ culture in Sierra Leone"
              - blockquote [ref=e101]: "\"The turntables don't care who's spinning. Only the crowd does.\""
          - generic [ref=e103]:
            - img "DJ SOUNDMAN" [ref=e105]
            - generic [ref=e106]:
              - generic [ref=e107]: Pioneer
              - heading "DJ SOUNDMAN" [level=3] [ref=e108]
              - paragraph [ref=e109]: 1988 – 2005
              - paragraph [ref=e110]: The Eastern Region's ambassador of sound. DJ Soundman connected Kenema to Freetown's music scene, bringing the latest tracks to the provinces before anyone else.
              - paragraph [ref=e111]: "Known for: Bridging urban and provincial music scenes"
              - blockquote [ref=e112]: "\"Every town deserves to hear the best music.\""
