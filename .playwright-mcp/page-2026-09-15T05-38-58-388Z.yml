            - generic [ref=f3e183]:
              - text: About
              - paragraph [ref=f3e185]: DJ Fred Max is an international DJ, music curator, and event producer bridging African and global sounds across China and the world. Originally from Sierra Leone and based in Shanghai, he is known for his seamless blends of Afrobeats, Amapiano, R&B, Slow Jams, and global club music, delivering emotionally rich and high-energy experiences on and off the stage. With over a decade of experience, DJ Fred Max has built a strong reputation for creating immersive musical journeys — from intimate lounge sessions to large-scale events and festivals. He is the founder of Sound It, a cultural platform dedicated to music, events, and creative experiences, as well as RNB & Slow Sessions, a signature event series celebrated for its soulful, timeless sound and carefully curated atmosphere.
