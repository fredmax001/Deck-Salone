version: '3.8'

services:
  deck-salone-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deck-salone-api
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://deck-salone-redis:6379
      - UPLOADS_DIR=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./app/.env
    # We do NOT expose port 5000 to the host because the internal deck-salone-web (nginx) handles it.
    volumes:
      - /opt/deck-salone/uploads:/app/uploads
      - /opt/deck-salone/uploads:/app/app/api/uploads
      - /opt/deck-salone/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_started
    networks:
      - deck-salone-network
      - sounditdj-network

  redis:
    image: redis:7-alpine
    container_name: deck-salone-redis
    restart: always
    volumes:
      - deck-salone-redis-data:/data
    networks:
      - deck-salone-network

  deck-salone-web:
    image: nginx:alpine
    container_name: deck-salone-web
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/dist:/usr/share/nginx/html:ro
    depends_on:
      - deck-salone-api
    networks:
      # Connect to internal network so it can proxy to deck-salone-api
      - deck-salone-network
      # Connect to external sounditdj-network so the master edge proxy can route to this container via 'http://deck-salone-web'
      - sounditdj-network

volumes:
  deck-salone-redis-data:

networks:
  deck-salone-network:
    driver: bridge
  sounditdj-network:
    external: true
    name: sounditdj_sounditdj-network
