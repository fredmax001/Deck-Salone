services:
  deck-salone-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deck-salone-api
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://deck-salone-redis:6379
      - UPLOADS_DIR=/app/uploads
      - DATABASE_URL=postgresql://soundit:password@host.docker.internal:5432/sounditdjs?schema=public
      - FRONTEND_URL=http://localhost:8080,http://192.168.2.184:8080,http://DJs-MacBook.local:8080
    env_file:
      - ./app/.env
    volumes:
      - ./uploads:/app/uploads
      - ./uploads:/app/app/api/uploads
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
    networks:
      - deck-salone-network

  redis:
    image: redis:7-alpine
    container_name: deck-salone-redis
    restart: always
    volumes:
      - deck-salone-redis-data:/data
    networks:
      - deck-salone-network

  deck-salone-web:
    image: nginx:alpine
    container_name: deck-salone-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - deck-salone-api
    networks:
      - deck-salone-network

volumes:
  deck-salone-redis-data:

networks:
  deck-salone-network:
    driver: bridge
